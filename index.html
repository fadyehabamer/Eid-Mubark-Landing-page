<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
        integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
        crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="صفحة تهنئة بعيد الفطر المبارك: عيد مبارك.">
    <title>عيد مبارك</title>
</head>

<body>
    <nav>
        <div class="logo">
            لوجو
        </div>

        <div class="list">
            <ul>
                <li>الرئيسية</li>
                <li>عنا</li>
                <li>تواصل معنا</li>
            </ul>
        </div>

        <div class="icons">
            <i class="fas fa-bars" aria-hidden="true"></i>
            <i class="fas fa-user" aria-hidden="true"></i>
        </div>
    </nav>


    <div class="landing">
        <div class="text">
            <h1>
                عيد <span> مبارك </span>
            </h1>
            <p>
                اتمني من الله ان يبارك لكم في هذه الايام الكريمه
            </p>
        </div>

        <div class="img">
            <lottie-player aria-hidden="true" src="https://assets1.lottiefiles.com/packages/lf20_261j5jsz.json" background="transparent"
                speed="1" loop autoplay></lottie-player>
        </div>
    </div>




    <script>
        // respect "reduce motion": show the Lottie animation as a still frame instead of looping it
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            document.querySelectorAll("lottie-player").forEach(function (player) {
                player.removeAttribute("autoplay");
                player.removeAttribute("loop");
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@lottiefiles/lottie-player@2.0.12/dist/lottie-player.js"
        integrity="sha384-i8zT4p4C0XG4mPhfz0zuffZpppP8NjlttNsP6srEdEBatwZkcYUBoQtAW7sfKEp2"
        crossorigin="anonymous"></script>
</body>

</html>
